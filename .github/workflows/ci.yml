name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  guardrails:
    # The guardrails are the product. CI proves each one on every push rather
    # than asking anyone to take the README's word for it.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Every bundled playbook validates
        run: soar validate playbooks

      - name: A dry run changes nothing
        run: |
          soar run playbooks/compromised-credential.yaml \
            --input token=tok_a1b2c3 --input host=pay-web-03 \
            --input source_ip=203.0.113.44 --input reporter=ci --out dry.json
          python -c "
          import json; r = json.load(open('dry.json'))
          assert r['dry_run'], 'run was not a dry run by default'
          assert all(s['outcome'] == 'dry_run' for s in r['steps']), 'something executed'
          print('dry run touched nothing')"

      - name: An unattended run denies gated steps rather than approving itself
        run: |
          set +e
          soar run playbooks/compromised-credential.yaml \
            --input token=tok_a1b2c3 --input host=pay-web-03 \
            --input source_ip=203.0.113.44 --input reporter=ci \
            --execute --out unattended.json < /dev/null
          set -e
          python -c "
          import json; r = json.load(open('unattended.json'))
          denied = [s for s in r['steps'] if s['outcome'] == 'denied']
          assert denied, 'an unattended run approved its own destructive steps'
          print(f'{len(denied)} destructive step(s) correctly denied')"

      - name: A destructive step with no rollback fails validation
        run: |
          mkdir -p /tmp/bad
          cat > /tmp/bad/no-rollback.yaml <<'YAML'
          id: no-rollback
          inputs: [host]
          steps:
            - id: iso
              action: isolate_host
              params: { host: "{host}" }
          YAML
          if soar validate /tmp/bad; then
            echo "::error::a destructive step with no rollback was accepted"
            exit 1
          fi
          echo "correctly rejected"
