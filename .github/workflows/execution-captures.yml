name: Execution captures
on:
  push:
    paths:
      - '.github/workflows/execution-captures.yml'
      - '.github/tools/capture.py'
      - '.github/tools/capture-browser.mjs'
      - 'docs/capture-config.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: execution-captures-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare capture dependencies
        run: |
          python -m pip install pillow markdown-it-py
          npm install --prefix "$RUNNER_TEMP/capture-browser" --ignore-scripts playwright@1.60.0
          "$RUNNER_TEMP/capture-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "CAPTURE_BROWSER_ROOT=$RUNNER_TEMP/capture-browser" >> "$GITHUB_ENV"
      - name: Execute fixtures and capture interfaces
        run: python .github/tools/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-captures
          path: |
            docs/
            **/docs/screenshots/
            **/docs/verification.md
            **/README.md
          if-no-files-found: error
