id: compromised-credential
name: Compromised API credential
version: "2"
owner: SOC
description: >-
  A credential has appeared somewhere it should not have - a public repository,
  a paste site, a threat-intel feed. Contain the credential, preserve evidence,
  and only isolate the host if it is actually running something that matters.

triggers:
  - secret_scanner.leaked_credential
  - threat_intel.credential_exposure

inputs: [token, host, source_ip, reporter]

steps:
  - id: enrich
    action: lookup_host
    description: Find out what this host is before deciding how hard to hit it.
    params: { host: "{host}" }
    approval: never
    bind: { criticality: criticality, owner: owner }

  - id: ticket
    action: open_ticket
    description: Everything after this references the ticket.
    params:
      title: "Leaked credential {token} on {host}"
      reporter: "{reporter}"
      criticality: "{criticality}"
    approval: never
    bind: { ticket_id: ticket_id }

  - id: snapshot
    action: snapshot_host
    description: >-
      Forensics before containment. Isolation can trigger cleanup routines and
      destroy the evidence of how the credential leaked.
    params: { host: "{host}" }
    approval: never

  - id: revoke
    action: revoke_token
    description: The credential itself. Irreversible, so it is gated.
    params: { token: "{token}" }
    approval: destructive
    rollback:
      action: notify
      params:
        channel: "#security"
        message: "Could not undo revocation of {token} — it must be reissued manually."

  - id: block_source
    action: block_ip
    description: Block the address the credential was used from.
    params: { ip: "{source_ip}" }
    approval: destructive
    rollback:
      action: unblock_ip
      params: { ip: "{source_ip}" }

  - id: isolate
    action: isolate_host
    description: >-
      Only for critical assets. Isolating a standard host over a leaked
      credential costs more than it saves.
    when: "criticality == critical"
    params: { host: "{host}" }
    approval: always
    rollback:
      action: release_host
      params: { host: "{host}" }

  - id: announce
    action: notify
    description: Tell the channel what was done, not that something happened.
    params:
      channel: "#security-incidents"
      message: >-
        {ticket_id}: revoked {token}, blocked {source_ip}, host {host}
        ({criticality}). Owner {owner} notified.
    approval: never
    continue_on_error: true
