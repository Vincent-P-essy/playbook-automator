[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbook-automator"
version = "1.0.0"
description = "A minimal SOAR that defaults to doing nothing: dry run by default, approval on irreversible steps, idempotency by key, automatic rollback in reverse, and a record of every step whether it ran or not."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
keywords = ["soar", "incident-response", "automation", "security", "playbook", "blue-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["PyYAML>=5.4", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
soar = "soar.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/playbook-automator"

[tool.hatch.build.targets.wheel]
packages = ["src/soar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
